[project]
name = "one"
version = "0.1.0"
description = ""
authors = [
    {name = "Tigran",email = "tgevorg530@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "pep8 (>=1.7.1,<2.0.0)",
    "isort (>=5.13.0,<6.0.0)"
]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=5.0.0,<7.0.0)"
]

[tool.black]
line-length = 79
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.isort]
profile = "black"
line_length = 79